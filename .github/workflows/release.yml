name: Release

# A pushed v* tag publishes to PyPI and then to the official MCP Registry, each behind
# its own protected environment. A manual run (workflow_dispatch) is the rehearsal:
# it publishes to TestPyPI and skips the registry. No container image is built or
# pushed. Every action is pinned to a full commit SHA (the comment names the release).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# bash -eo pipefail for every run step, so a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Tag matches the package version
        if: github.event_name == 'push'
        run: |
          version="$(python scripts/check_release_consistency.py --print-version)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - name: Release consistency
        run: python scripts/check_release_consistency.py
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
      - name: Build
        run: python -m build
      - name: Twine check
        run: python -m twine check --strict dist/*
      - name: Wheel and sdist contents
        run: python scripts/check_release_consistency.py --dist dist --only dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/sn1per-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # Trusted publishing; PEP 740 attestations are generated by default.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  testpypi:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/sn1per-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # A rehearsal may run more than once for the same version.
          skip-existing: true

  # Gate G2 (P.6): the mcp-registry-publish environment has a required reviewer, who
  # approves only after both uvx short forms ran against the real PyPI once the pypi job
  # finished, and UVX_SHORT_FORM_OK=yes was recorded (server.json ships runtimeHint uvx;
  # TestPyPI cannot prove the PyPI forms). The workflow cannot check that record itself.
  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: mcp-registry-publish
    # Namespace io.github.1N3/sn1per-mcp: authenticated with GitHub OIDC (no DNS key).
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: "1.8.1"
      # sha256 of mcp-publisher_linux_amd64.tar.gz from the registry v1.8.1 release.
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the pinned mcp-publisher
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" --version || true
      - name: Wait until PyPI serves this version with the mcp-name line
        run: |
          python3 - <<'PY'
          import http.client
          import json
          import os
          import sys
          import time
          import urllib.request

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          url = f"https://pypi.org/pypi/sn1per-mcp/{version}/json"
          token = "<!-- mcp-name: " + json.load(open("server.json"))["name"] + " -->"
          deadline = time.monotonic() + 15 * 60
          while True:
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      description = json.load(response)["info"]["description"] or ""
                  if token in description:
                      print(f"{url}: ready")
                      sys.exit(0)
                  print(f"{url}: served, mcp-name line not found yet")
              # URLError, HTTPError, timeouts and resets are OSError; IncompleteRead and
              # RemoteDisconnected are HTTPException; a partial JSON document is
              # ValueError, a missing key KeyError or TypeError. All of them retry.
              except (OSError, http.client.HTTPException, ValueError, KeyError,
                      TypeError) as exc:
                  print(f"{url}: not ready ({exc})")
              if time.monotonic() >= deadline:
                  sys.exit("PyPI did not serve the release with the mcp-name line within 15 minutes")
              time.sleep(30)
          PY
      - name: Publish to the MCP Registry
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
