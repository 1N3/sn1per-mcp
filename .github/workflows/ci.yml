name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# bash -eo pipefail for every run step, so a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit SHA (the comment names the release).
# Every smoke run uses the same isolation: scanning disabled, a CLI path that does
# not exist, an empty scope, and HOME and XDG_STATE_HOME in a fresh temporary
# directory. Smoke runs call only initialize, tools/list and read-only tools.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Release consistency (scrub, em-dash, examples, links, consistency)
        run: python scripts/check_release_consistency.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q -p no:cacheprovider

  sdk-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install with the oldest supported MCP SDK
        run: python -m pip install -e '.[dev]' 'mcp==1.28.1'
      - name: Show the SDK version
        run: python -m pip show mcp
      - name: Test
        run: python -m pytest -q -p no:cacheprovider

  sdk-latest-1x:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install with the newest MCP SDK 1.x
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install --upgrade 'mcp<2'
      - name: Show the SDK version
        run: python -m pip show mcp
      - name: Test
        run: python -m pytest -q -p no:cacheprovider

  # Expected to fail at import while the package requires mcp<2. It shows when a
  # port to the 2.x SDK is needed and how large it is.
  sdk-2x-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install with the newest MCP SDK 2.x
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install --upgrade 'mcp>=2,<3'
      - name: Show the SDK version
        run: python -m pip show mcp
      - name: Test
        run: python -m pytest -q -p no:cacheprovider

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install 'build>=1.2' 'twine>=5.1'
          python -m build
      - name: Twine check
        run: python -m twine check --strict dist/*
      - name: Wheel and sdist contents
        run: python scripts/check_release_consistency.py --dist dist --only dist
      - name: Test suite from the extracted sdist
        run: |
          # Distro packagers run the shipped tests from the sdist, outside a checkout.
          version="$(python scripts/check_release_consistency.py --print-version)"
          tar -xzf "dist/sn1per_mcp-$version.tar.gz" -C "$RUNNER_TEMP"
          sdist_dir="$RUNNER_TEMP/sn1per_mcp-$version"
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install "$sdist_dir[dev]"
          cd "$sdist_dir"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pytest -q -p no:cacheprovider
      - name: Clean-venv install and stdio smoke
        run: |
          python -m venv "$RUNNER_TEMP/smoke-venv"
          "$RUNNER_TEMP/smoke-venv/bin/python" -m pip install dist/*.whl
          SMOKE_HOME="$(mktemp -d)"
          SERVER_BIN="$RUNNER_TEMP/smoke-venv/bin/sn1per-mcp"
          test "$("$SERVER_BIN" --version)" = "sn1per-mcp $(python scripts/check_release_consistency.py --print-version)"
          smoke() {
            env -i PATH="/usr/bin:/bin" HOME="$SMOKE_HOME" XDG_STATE_HOME="$SMOKE_HOME/state" \
              SNIPER_SCAN_ENABLED=false SNIPER_BIN=/nonexistent/sniper SNIPER_MCP_SCOPE= \
              SNIPER_INSTALL_DIR="$SMOKE_HOME" SERVER="$SERVER_BIN" \
              python3 scripts/mcp-call.py "$@"
          }
          smoke tools | tee "$RUNNER_TEMP/tools.txt"
          test "$(wc -l < "$RUNNER_TEMP/tools.txt")" -eq 10
          smoke sniper_status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  kali:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: kalilinux/kali-rolling
    steps:
      - name: Install python3 and pipx from the Kali archive
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 pipx ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: pipx install of the built wheel
        run: |
          pipx install dist/*.whl
          test "$("$HOME/.local/bin/sn1per-mcp" --version)" = "sn1per-mcp $(python3 scripts/check_release_consistency.py --print-version)"
      - name: Stdio smoke
        run: |
          SMOKE_HOME="$(mktemp -d)"
          SERVER_BIN="$HOME/.local/bin/sn1per-mcp"
          smoke() {
            env -i PATH="/usr/bin:/bin" HOME="$SMOKE_HOME" XDG_STATE_HOME="$SMOKE_HOME/state" \
              SNIPER_SCAN_ENABLED=false SNIPER_BIN=/nonexistent/sniper SNIPER_MCP_SCOPE= \
              SNIPER_INSTALL_DIR="$SMOKE_HOME" SERVER="$SERVER_BIN" \
              python3 scripts/mcp-call.py "$@"
          }
          smoke tools | tee /tmp/tools.txt
          test "$(wc -l < /tmp/tools.txt)" -eq 10
          smoke sniper_status

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the introspection image
        run: docker build -t sn1per-mcp:ci .
      - name: initialize and tools/list over docker run -i
        run: |
          SERVER="docker run -i --rm --network none -e SNIPER_SCAN_ENABLED=false -e SNIPER_BIN=/nonexistent/sniper -e SNIPER_MCP_SCOPE= sn1per-mcp:ci" \
            python3 scripts/mcp-call.py tools | tee "$RUNNER_TEMP/tools.txt"
          test "$(wc -l < "$RUNNER_TEMP/tools.txt")" -eq 10
